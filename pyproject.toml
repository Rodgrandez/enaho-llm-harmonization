[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enaho-llm-harmonization"
version = "0.1.0"
description = "LLM-assisted harmonization of ENAHO (Peru) 2019 and 2024 with human validation and a weighted poverty benchmark"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rodrigo Grandez"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
